  /books/{id}/reading-time:
    post:
      tags: [Reading]
      operationId: addReadingTime
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingTimeRequest' } } } }
      responses:
        '200': { description: Updated weekly reading statistics, content: { application/json: { schema: { $ref: '#/components/schemas/WeeklyReadingStats' } } } }
  /reading-overview:
    get:
      tags: [Reading]
      operationId: getReadingOverview
      description: Current user's three most recently saved available books, newest book added within the server calendar week, and private reading statistics. Article and vault records are excluded.
      responses:
        '200': { description: Private reading overview, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingOverview' } } } }
        '401': { description: Authentication required }
  /books/{id}/metadata:
    get:
      tags: [Catalog]
      operationId: getBookMetadata
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Editable metadata, content: { application/json: { schema: { $ref: '#/components/schemas/BookMetadata' } } } }
    patch:
      tags: [Catalog]
      operationId: updateBookMetadata
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MetadataRequest' } } } }
      responses:
        '200': { description: Database metadata and optional write-back preview, content: { application/json: { schema: { type: object, required: [metadata], properties: { metadata: { $ref: '#/components/schemas/BookMetadata' }, writeBackPreview: { $ref: '#/components/schemas/FileOperationPreview' } } } } } }
  /ai/providers:
    get:
      tags: [AI]
      operationId: listAiProviders
      responses:
        '200': { description: AI providers available to managers, content: { application/json: { schema: { $ref: '#/components/schemas/AiProviderList' } } } }
  /ai/status:
    get:
      tags: [AI]
      operationId: getAiAvailability
      responses:
        '200': { description: Readiness flags for signed-in users without exposing settings, content: { application/json: { schema: { $ref: '#/components/schemas/AiAvailabilityView' } } } }
  /ai/test:
    post:
      tags: [AI]
      operationId: testAiConnection
      responses:
        '200': { description: Connection test succeeded using saved configuration, content: { application/json: { schema: { $ref: '#/components/schemas/AiConnectionResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /ai/models:
    post:
      tags: [AI]
      operationId: listAiProviderModels
      description: Fetches live models from an AI provider endpoint. Requires OWNER or ADMIN and settings.ai.edit. Reuses stored API key only when baseUrl matches the saved origin.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FetchAiModelsRequest' } } } }
      responses:
        '200': { description: Discovered models, content: { application/json: { schema: { $ref: '#/components/schemas/AiModelListResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /ai/assistance:
    post:
      tags: [AI]
      operationId: requestAiAssistance
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AiAssistanceRequest' } } } }
      responses:
        '200': { description: Grounded assistance result, content: { application/json: { schema: { $ref: '#/components/schemas/AiAssistanceResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /metadata-terms:
    get:
      tags: [Catalog]
      operationId: searchMetadataTerms
      description: Shared vocabulary search; requires library.edit or library.upload.
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [LANGUAGE, SERIES, TAG, KNOWLEDGE] } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 30 } }
      responses:
        '200': { description: Matching shared terms }
    post:
      tags: [Catalog]
      operationId: createMetadataTerm
      description: Creates or reuses one normalized term. Requires library.edit or library.upload.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MetadataTermInput' } } } }
      responses:
        '200': { description: Canonical reusable term }
  /metadata-terms/ensure:
    post:
      tags: [Catalog]
      operationId: ensureMetadataTerms
      description: Atomically creates or reuses up to 50 terms in input order; requires library.edit or library.upload.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [kind, items], properties: { kind: { type: string, enum: [LANGUAGE, SERIES, TAG, KNOWLEDGE] }, items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/MetadataTermInput' } } } }
      responses:
        '200': { description: Canonical reusable terms in input order }
  /ai/metadata-terms:
    post:
      tags: [AI]
      operationId: previewMetadataTerms
      description: Language or explicitly evidenced series suggestions from authorized bounded book text. Does not persist vocabulary until adopted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [kind, source, id, consent], properties: { kind: { type: string, enum: [LANGUAGE, SERIES] }, source: { type: string, enum: [BOOK, UPLOAD] }, id: { type: string, format: uuid }, consent: { type: boolean } } }
      responses:
        '200': { description: At most five value/label suggestions }
  /ai/book-knowledge:
    post:
      tags: [AI]
      operationId: previewBookKnowledge
      description: Consent-based preview of evidence-backed knowledge points extracted only from bounded PDF/EPUB body samples. BOOK requires reader.read and library.edit; UPLOAD requires library.upload and OWNER or ADMIN. Results are never persisted until explicitly included in a metadata edit or upload confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookKnowledgeRequest' }
      responses:
        '200': { description: Preview knowledge points with source fingerprint and server-measured sample coverage, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeDraft' } } } }
  /ai/book-classification:
    post:
      tags: [AI]
      operationId: classifyBookBody
      description: Consent-based, read-only suggestions derived only from bounded PDF/EPUB body samples. BOOK requires reader.read and library.edit; UPLOAD requires library.upload and OWNER or ADMIN. No metadata is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookClassificationRequest' }
      responses:
        '200': { description: Thema subjects and evidence-backed ordinary tags from sampled body text, content: { application/json: { schema: { $ref: '#/components/schemas/BookClassificationResult' } } } }
  /knowledge:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeGraph
      responses:
        '200': { description: Knowledge graph entries for available books, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeList' } } } }
  /knowledge/books/{bookId}/generate:
    post:
      tags: [Knowledge]
      operationId: generateBookKnowledge
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Updated knowledge graph list, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeList' } } } }
  /knowledge/books/{bookId}:
    get:
      tags: [Knowledge]
      operationId: getBookKnowledgeDraft
      description: Returns the saved evidence-backed knowledge points for the current available file, or an empty draft with its current fingerprint. Requires knowledge.view and reader.read.
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Current knowledge points and source fingerprint, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeDraft' } } } }
  /ai/settings:
    get:
      tags: [AI]
      operationId: getAiSettings
      responses:
        '200': { description: AI matching settings without secret values, content: { application/json: { schema: { $ref: '#/components/schemas/AiSettings' } } } }
    put:
      tags: [AI]
      operationId: updateAiSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AiSettingsRequest' } } } }
      responses:
        '200': { description: Updated AI matching settings without secret values, content: { application/json: { schema: { $ref: '#/components/schemas/AiSettings' } } } }
  /books/{id}/cover:
    get:
      tags: [Catalog]
      operationId: getBookCover
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Current application cover, content: { image/jpeg: { schema: { type: string, format: binary } } } }
    put:
      tags: [Catalog]
      operationId: replaceBookCover
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
      responses:
        '200': { description: Custom cover normalized and activated, content: { application/json: { schema: { $ref: '#/components/schemas/BookMetadata' } } } }
    delete:
      tags: [Catalog]
      operationId: restoreBookCover
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Custom cover retired and generated or extracted cover restored, content: { application/json: { schema: { $ref: '#/components/schemas/BookMetadata' } } } }
  /annotations:
    get:
      tags: [Annotations]
      operationId: listAnnotations
      parameters: [{ name: bookId, in: query, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Current user's annotations, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Annotation' } } } } } } }
    post:
      tags: [Annotations]
      operationId: createAnnotation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnnotationRequest' } } } }
      responses:
        '200': { description: Created annotation, content: { application/json: { schema: { $ref: '#/components/schemas/Annotation' } } } }
  /annotations/books:
    get:
      tags: [Annotations]
      operationId: listAnnotationBooks
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 36, maximum: 100 } }
      responses:
        '200':
          description: Books containing the current user's private annotations
          content: { application/json: { schema: { $ref: '#/components/schemas/AnnotationBookPage' } } }
  /annotations/books/{bookId}/export/{format}:
    get:
      tags: [Annotations]
      operationId: exportBookAnnotations
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: format, in: path, required: true, schema: { type: string, enum: [DOCX, XLSX] } }
      responses:
        '200':
          description: Current user's annotations for one book as an Office document
          headers: { Content-Disposition: { schema: { type: string } } }
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
  /annotations/{id}:
    delete:
      tags: [Annotations]
      operationId: deleteAnnotation
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Deleted } }
  /file-task-history:
    get:
      tags: [File operations]
      operationId: listFileTaskHistory
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 10, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Unified chronologically merged file operation and book upload history, content: { application/json: { schema: { type: object, required: [total, items], properties: { total: { type: integer, format: int64 }, items: { type: array, items: { type: object, required: [id, type, status, title, createdAt, updatedAt], properties: { id: { type: string, format: uuid }, type: { type: string, enum: [FILE_OPERATION, BOOK_UPLOAD] }, action: { type: string, nullable: true }, status: { type: string }, stage: { type: string, nullable: true }, title: { type: string }, originalFilename: { type: string, nullable: true }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } } } } } } } } }
  /file-operations/preview:
    post:
      tags: [File operations]
      operationId: previewFileOperation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FileOperationPreviewRequest' } } } }
      responses:
        '200': { description: Server-validated preview. Book MOVE requests are disabled and return 403 BOOK_MOVE_DISABLED., content: { application/json: { schema: { $ref: '#/components/schemas/FileOperationPreview' } } } }
  /file-operations:
    post:
      tags: [File operations]
      operationId: executeFileOperation
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FileOperationExecuteRequest' } } } }
      responses:
        '200': { description: Queued or existing idempotent operation, content: { application/json: { schema: { $ref: '#/components/schemas/FileOperation' } } } }
  /file-operations/{id}:
    get:
      tags: [File operations]
      operationId: getFileOperation
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Operation, content: { application/json: { schema: { $ref: '#/components/schemas/FileOperation' } } } }
  /file-operations/book-files/{bookFileId}/versions:
    get:
      tags: [File operations]
      operationId: listFileVersions
      description: OWNER/ADMIN with settings.recycle.view can list retained, unexpired file versions.
      parameters: [{ name: bookFileId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Retained versions, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/FileVersion' } } } } } } }
  /file-operations/versions/{versionId}/restore/preview:
    post:
      tags: [File operations]
      operationId: previewFileVersionRestore
      description: Requires settings.recycle.restore; validates the current file and archive fingerprints before creating a bound preview.
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expectedFingerprint], properties: { expectedFingerprint: { type: string } } } } } }
      responses:
        '200': { description: Version restore preview, content: { application/json: { schema: { $ref: '#/components/schemas/FileOperationPreview' } } } }
  /file-operations/versions/{versionId}/restore:
    post:
      tags: [File operations]
      operationId: restoreFileVersion
      description: Executes a matching preview with settings.recycle.restore; preserves the current file as another retained version.
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FileOperationExecuteRequest' } } } }
      responses:
        '200': { description: Queued or existing restore operation, content: { application/json: { schema: { $ref: '#/components/schemas/FileOperation' } } } }
  /recycle-bin:
    get:
      tags: [File operations]
      operationId: listRecycleBin
      responses:
        '200': { description: Active recycle entries, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/RecycleBinEntry' } } } } } } }
  /recycle-bin/{id}/restore:
    post:
      tags: [File operations]
      operationId: restoreRecycleEntry
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FileOperationExecuteRequest' } } } }
      responses:
        '200': { description: Queued restore, content: { application/json: { schema: { $ref: '#/components/schemas/FileOperation' } } } }
  /recycle-bin/{id}:
    delete:
      tags: [File operations]
      operationId: purgeRecycleEntry
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FileOperationExecuteRequest' } } } }
      responses:
        '200': { description: Queued permanent purge, content: { application/json: { schema: { $ref: '#/components/schemas/FileOperation' } } } }
  /library-roots:
    get:
      tags: [File operations]
      operationId: listLibraryRoots
      responses:
        '200':
          description: Capabilities for the deployment-configured default book library. Library registration is disabled; legacy registration and registration-preview POSTs return 403 LIBRARY_ROOT_REGISTRATION_DISABLED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryRootList' }
    post:
      tags: [File operations]
      operationId: createLibraryRoot
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryRootRegistrationRequest' } } } }
      responses:
        '403': { $ref: '#/components/responses/Problem' }
  /library-roots/preview:
    post:
      tags: [File operations]
      operationId: previewLibraryRoot
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { path: { type: string } } } } } }
      responses:
        '403': { $ref: '#/components/responses/Problem' }
  /library-roots/check:
    post:
      tags: [File operations]
      operationId: checkLibraryRoots
      responses:
        '200': { description: Refreshed capability and content storage scan snapshots, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryRootList' } } } }
        '503': { $ref: '#/components/responses/Problem' }
  /library-roots/content-storage:
    get:
      tags: [File operations]
      operationId: listContentStorage
      responses:
        '200':
          description: Live capacity and last completed read-only directory scan; requires settings.roots.view and exposes no paths or user content.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [kind, canRead, canWrite]
                  properties:
                    kind: { type: string, enum: [ARTICLES, VAULT] }
                    canRead: { type: boolean }
                    canWrite: { type: boolean }
                    freeBytes: { type: integer, format: int64, nullable: true }
                    lastScanAt: { type: string, format: date-time, nullable: true }
  /book-uploads:
    get:
      tags: [Book uploads]
      operationId: listBookUploads
      responses:
        '200': { description: Upload queue owned by the current manager, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BookUpload' } } } } } } }
    post:
      tags: [Book uploads]
      operationId: createBookUpload
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateBookUploadRequest' } } } }
      responses:
        '200': { description: Created staging session, content: { application/json: { schema: { $ref: '#/components/schemas/BookUpload' } } } }
  /book-uploads/precheck:
    post:
      tags: [Book uploads]
      operationId: precheckBookUpload
      description: Advisory SHA-256 and size check limited to the visible regular catalog and the current manager's pending drafts. Does not create a session or write files. Server receive and commit independently verify actual content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint, sizeBytes]
              properties:
                fingerprint: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                sizeBytes: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Private advisory duplicate result, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [match]
                properties:
                  match: { type: string, enum: [NONE, CATALOG, DRAFT] }
  /book-uploads/{id}:
    get:
      tags: [Book uploads]
      operationId: getBookUpload
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Upload state, content: { application/json: { schema: { $ref: '#/components/schemas/BookUpload' } } } } }
    delete:
      tags: [Book uploads]
      operationId: cancelBookUpload
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Upload cancelled } }
  /book-uploads/{id}/content:
    put:
      tags: [Book uploads]
      operationId: uploadBookContent
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses: { '200': { description: File received and queued for inspection, content: { application/json: { schema: { $ref: '#/components/schemas/BookUpload' } } } } }
  /book-uploads/{id}/metadata:
    patch:
      tags: [Book uploads]
      operationId: updateBookUploadMetadata
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BookMetadataDraft' } } } }
      responses: { '200': { description: Reviewed metadata saved, content: { application/json: { schema: { $ref: '#/components/schemas/BookUpload' } } } } }
  /book-uploads/{id}/match:
    post:
      tags: [Book uploads]
      operationId: matchBookUpload
      description: Searches editions for one upload and persists candidates without changing its draft. Refresh bypasses provider and AI caches. Failures retain previous candidates.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/OnlineMatchRequest' } } } }
      responses: { '200': { description: Saved edition candidates or persistent retry error, content: { application/json: { schema: { $ref: '#/components/schemas/BookUpload' } } } } }
  /metadata-providers:
    get:
      tags: [Book uploads]
      operationId: getMetadataProviderSettings
      description: Requires OWNER or ADMIN role and settings.metadata.view.
      responses: { '200': { description: Fixed metadata sources and availability, content: { application/json: { schema: { $ref: '#/components/schemas/MetadataProviderSettings' } } } } }
    put:
      tags: [Book uploads]
      operationId: updateMetadataProviderSettings
      description: Requires OWNER or ADMIN role and settings.metadata.edit. Arbitrary source URLs and credentials are not accepted.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MetadataProviderSettingsInput' } } } }
      responses: { '200': { description: Saved source switches, content: { application/json: { schema: { $ref: '#/components/schemas/MetadataProviderSettings' } } } } }
  /book-uploads/{id}/enrich:
    post:
      tags: [Book uploads]
      operationId: enrichBookUpload
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Online enrichment retried, content: { application/json: { schema: { $ref: '#/components/schemas/BookUpload' } } } } }
  /book-uploads/{id}/ai-match:
    post:
      tags: [Book uploads]
      operationId: aiMatchBookUpload
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/AiMatchRequest' } } } }
      responses: { '200': { description: AI metadata candidates added for manual review, content: { application/json: { schema: { $ref: '#/components/schemas/BookUpload' } } } } }
  /book-uploads/{id}/cover:
    get:
      tags: [Book uploads]
      operationId: getBookUploadCover
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Current staged cover, content: { image/jpeg: { schema: { type: string, format: binary } } } } }
    put:
      tags: [Book uploads]
      operationId: uploadBookCover
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
      responses: { '200': { description: Cover normalized and selected, content: { application/json: { schema: { $ref: '#/components/schemas/BookUpload' } } } } }
  /book-uploads/{id}/cover-selection:
    post:
      tags: [Book uploads]
      operationId: selectBookUploadCover
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [candidateId], properties: { candidateId: { type: string } } } } } }
      responses: { '200': { description: Provider cover downloaded and selected, content: { application/json: { schema: { $ref: '#/components/schemas/BookUpload' } } } } }
  /book-uploads/{id}/commit:
    post:
      tags: [Book uploads]
      operationId: commitBookUpload
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/CommitBookUploadRequest' } } } }
      responses: { '200': { description: Upload atomically committed, content: { application/json: { schema: { $ref: '#/components/schemas/BookUpload' } } } } }
  /reader-fonts:
    get:
      tags: [Reader fonts]
      operationId: listReaderFonts
      parameters: [{ name: includeDisabled, in: query, schema: { type: boolean, default: false } }]
      responses:
        '200': { description: Enabled reader fonts, content: { application/json: { schema: { $ref: '#/components/schemas/ReaderFontList' } } } }
    post:
      tags: [Reader fonts]
      operationId: createReaderFont
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReaderFontRequest' } } } }
      responses: { '200': { description: Font upload session, content: { application/json: { schema: { $ref: '#/components/schemas/ReaderFont' } } } } }
  /reader-fonts/{id}:
    patch:
      tags: [Reader fonts]
      operationId: updateReaderFontStatus
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateReaderFontRequest' } } } }
      responses: { '200': { description: Updated reader font, content: { application/json: { schema: { $ref: '#/components/schemas/ReaderFont' } } } } }
  /reader-fonts/{id}/content:
    put:
      tags: [Reader fonts]
      operationId: uploadReaderFontContent
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses: { '200': { description: Font stored after validation, content: { application/json: { schema: { $ref: '#/components/schemas/ReaderFont' } } } } }
    get:
      tags: [Reader fonts]
      operationId: getReaderFontContent
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Enabled font file, content: { application/octet-stream: { schema: { type: string, format: binary } } } } }
  /articles:
    get:
      tags: [Articles]
      operationId: listArticles
      responses:
        '200': { description: Visible articles for the current user, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ArticleSummary' } } } } }
    post:
      tags: [Articles]
      operationId: createArticle
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleDraft' } } } }
      responses:
        '200': { description: Saved article, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleDetail' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /articles/fetch:
    post:
      tags: [Articles]
      operationId: fetchArticle
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleFetchRequest' } } } }
      responses:
        '200': { description: Fetched and sanitized article draft, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleDraft' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /articles/fetch-stream:
    post:
      tags: [Articles]
      operationId: fetchArticleStream
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleFetchRequest' } } } }
      responses:
        '200': { description: NDJSON stream of progress, error, or result events, content: { application/x-ndjson: { schema: { type: string } } } }
  /articles/batch-import:
    post:
      tags: [Articles]
      operationId: batchImportArticles
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleBatchImportRequest' } } } }
      responses:
        '200': { description: Batch import summary, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleBatchImportResult' } } } }
  /articles/batch-import-stream:
    post:
      tags: [Articles]
      operationId: batchImportArticlesStream
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleBatchImportRequest' } } } }
      responses:
        '200': { description: NDJSON stream of batch import progress and item events, content: { application/x-ndjson: { schema: { type: string } } } }
  /articles/prepare:
    post:
      tags: [Articles]
      operationId: prepareArticleHtml
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArticlePrepareRequest' } } } }
      responses:
        '200': { description: Sanitized HTML preview, content: { application/json: { schema: { type: object, required: [html], properties: { html: { type: string } } } } } }
  /articles/knowledge:
    get:
      tags: [Articles]
      operationId: listArticleKnowledge
      responses:
        '200': { description: Article knowledge snapshots visible to the user, content: { application/json: { schema: { type: array, items: { type: object, required: [id, title, points], properties: { id: { type: string, format: uuid }, title: { type: string }, points: { type: string } } } } } } }
  /articles/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Articles]
      operationId: getArticle
      responses:
        '200': { description: Full sanitized article, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Articles]
      operationId: updateArticle
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleDraft' } } } }
      responses:
        '200': { description: Updated article, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleDetail' } } } }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Articles]
      operationId: deleteArticle
      responses:
        '204': { description: Article deleted }
  /articles/{id}/reading:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Articles]
      operationId: getArticleReadingState
      responses:
        '200': { description: Private reading progress and annotations JSON state, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleReadingState' } } } }
    put:
      tags: [Articles]
      operationId: updateArticleReadingState
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArticleReadingState' } } } }
      responses:
        '204': { description: Reading state saved }
  /articles/{id}/knowledge:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Articles]
      operationId: generateArticleKnowledge
      responses:
        '410': { $ref: '#/components/responses/Problem' }
  /articles/assets/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Articles]
      operationId: getArticleAsset
      responses:
        '200': { description: Sanitized PNG image asset, content: { image/png: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /reading-posts:
    get:
      tags: [Reading posts]
      operationId: listMyReadingPosts
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [BOOK, ARTICLE, ALL], default: ALL } }
        - { name: sourceId, in: query, required: false, description: Optional source book ID filter when kind=BOOK (returns visible book reviews with full markdown), schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Current user reading posts across books and articles, or visible book reviews when kind=BOOK and sourceId is specified, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingPostPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Reading posts]
      operationId: createReadingPost
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReadingPostRequest' } } } }
      responses:
        '200': { description: Created reading post, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingPost' } } } }
  /reading-posts/{kind}/{id}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [BOOK, ARTICLE] } }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Reading posts]
      operationId: getReadingPost
      responses:
        '200': { description: Reading post detail, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingPost' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Reading posts]
      operationId: updateReadingPost
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateReadingPostRequest' } } } }
      responses:
        '200': { description: Updated reading post, content: { application/json: { schema: { $ref: '#/components/schemas/ReadingPost' } } } }
        '409': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: HUMITE_SESSION
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
  responses:
    Problem:
      description: RFC 9457 problem
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    MetadataTermInput:
      type: object
      required: [label]
      properties:
        kind: { type: string, enum: [LANGUAGE, SERIES, TAG, KNOWLEDGE] }
        value: { type: string, maxLength: 1024 }
        label: { type: string, maxLength: 1024 }

    VaultPolicy:
      type: object
      required: [enabled, configured, revision]
      properties:
        enabled: { type: boolean }
        configured: { type: boolean }
        revision: { type: integer, format: int64 }
    TwoFactorStatus:
      type: object
      required: [enabled, configured, bound, verified, expiresAt]
      properties:
        enabled: { type: boolean }
        configured: { type: boolean }
        bound: { type: boolean }
        verified: { type: boolean }
        expiresAt: { type: integer, format: int64 }
    TwoFactorVerification:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 80 }
        recovery: { type: boolean, default: false }
    PasswordPolicy:
      type: object
      required: [minLength, requireUppercase, requireLowercase, requireDigit, requireSpecial]
      properties:
        minLength: { type: integer, minimum: 8, maximum: 64 }
        requireUppercase: { type: boolean }
        requireLowercase: { type: boolean }
        requireDigit: { type: boolean }
        requireSpecial: { type: boolean }
    MailSettings:
      type: object
      required: [enabled, host, port, security, username, sender, publicUrl]
      properties:
        enabled: { type: boolean }
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        security: { type: string, enum: [STARTTLS, TLS, LOCAL] }
        username: { type: string, maxLength: 320 }
        password: { type: string, writeOnly: true, maxLength: 1000 }
        passwordConfigured: { type: boolean, readOnly: true }
        sender: { type: string, format: email }
        publicUrl: { type: string, format: uri }
    RecoveryEmailInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    RecoveryBindInput:
      allOf:
        - { $ref: '#/components/schemas/RecoveryEmailInput' }
        - type: object
          required: [password]
          properties:
            password: { type: string, writeOnly: true, minLength: 1, maxLength: 200 }
    RecoveryTokenInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 43, maxLength: 43 }
    RecoveryResetInput:
      allOf:
        - { $ref: '#/components/schemas/RecoveryTokenInput' }
        - type: object
          required: [password]
          properties:
            password: { type: string, writeOnly: true, minLength: 1, maxLength: 64 }
    Problem:
      type: object
      properties: { type: { type: string, format: uri }, title: { type: string }, status: { type: integer }, detail: { type: string }, code: { type: string } }
    CsrfToken:
      type: object
      required: [token, headerName]
      properties: { token: { type: string }, headerName: { type: string } }
    PermissionSnapshot:
      type: object
      required: [role, revision, grants]
      properties:
        role: { $ref: '#/components/schemas/UserRole' }
        revision: { type: integer, format: int64 }
        grants: { type: array, uniqueItems: true, items: { type: string } }
    RolePermissionPolicy:
      type: object
      required: [revision, grants]
      properties:
        revision: { type: integer, format: int64 }
        grants:
          type: object
          additionalProperties: { type: array, uniqueItems: true, items: { type: string } }
    UserRole: { type: string, enum: [OWNER, ADMIN, MEMBER] }
    UserStatus: { type: string, enum: [ACTIVE, DISABLED] }
    SessionUser:
      type: object
      required: [id, username, displayName, role, mustChangePassword]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        mustChangePassword: { type: boolean }
        canChangePasswordWithoutCurrent: { type: boolean, description: The current session has already verified the active temporary password. }
    ManagedUser:
      allOf:
        - { $ref: '#/components/schemas/SessionUser' }
        - { type: object, required: [status, createdAt], properties: { status: { $ref: '#/components/schemas/UserStatus' }, createdAt: { type: string, format: date-time }, lastLoginAt: { type: [string, 'null'], format: date-time } } }
    SetupRequest:
      type: object
      required: [username, displayName, password]
      properties: { username: { type: string, pattern: '^[a-zA-Z0-9._-]{3,80}$' }, displayName: { type: string, maxLength: 120 }, password: { type: string, minLength: 1, maxLength: 64 } }
    SetupStatus:
      type: object
      required: [initialized]
      properties: { initialized: { type: boolean } }
    LoginRequest: { type: object, required: [username, password], properties: { username: { type: string, maxLength: 80 }, password: { type: string, maxLength: 256 } } }
    RegistrationPolicy:
      type: object
      required: [registrationEnabled]
      properties: { registrationEnabled: { type: boolean } }
    RegisterRequest:
      type: object
      required: [username, displayName, password]
      properties:
        username: { type: string, pattern: '^[a-zA-Z0-9._-]{3,80}$' }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, minLength: 1, maxLength: 64 }
    SessionStatus:
      type: object
      required: [expiresAt, revocationRequested, serverTime]
      properties:
        expiresAt: { type: integer, format: int64 }
        revocationRequested: { type: boolean }
        serverTime: { type: integer, format: int64 }
    SessionPolicy:
      type: object
      required: [maxMinutes]
      properties: { maxMinutes: { type: integer, minimum: 5, maximum: 43200 } }
    ActiveSession:
      type: object
      required: [id, userId, username, displayName, role, createdAt, lastAccessAt, expiresAt, current, ending]
      properties:
        id: { type: string }
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        createdAt: { type: string, format: date-time }
        lastAccessAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }
        ending: { type: boolean }
    LoginLogEntry:
      type: object
      required: [id, subjectId, outcome, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: [string, 'null'], format: uuid }
        subjectId: { type: string }
        outcome: { type: string }
        ip: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    LoginLogPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LoginLogEntry' } }
        total: { type: integer, format: int64, minimum: 0 }
    SiteSettings:
      type: object
      required: [name, tagline, description, keywords, publicUrl, allowIndexing, virtualLibraryEnabled, icpNumber, policeNumber, copyright, contactEmail]
      properties:
        name: { type: string, maxLength: 80 }
        tagline: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        keywords: { type: string, maxLength: 250 }
        publicUrl: { type: string, maxLength: 255 }
        allowIndexing: { type: boolean }
        virtualLibraryEnabled: { type: boolean }
        icpNumber: { type: string, maxLength: 80 }
        policeNumber: { type: string, maxLength: 80 }
        copyright: { type: string, maxLength: 200 }
        contactEmail: { type: string, format: email, maxLength: 254 }
    VaultConfig:
      type: object
      required: [envelope, revision]
      properties:
        envelope: { type: string, maxLength: 16384 }
        revision: { type: integer, format: int64, minimum: 0 }
    VaultObject:
      type: object
      required: [id, manifest, state, revision, chunk_count]
      properties:
        id: { type: string, format: uuid }
        manifest: { type: string }
        state: { type: string }
        revision: { type: integer, format: int64 }
        chunk_count: { type: integer, minimum: 1, maximum: 256 }
    CreateVaultObjectRequest:
      type: object
      required: [manifest, state, chunkCount]
      properties:
        manifest: { type: string, maxLength: 32768 }
        state: { type: string, maxLength: 2000000 }
        chunkCount: { type: integer, minimum: 1, maximum: 256 }
    UpdateVaultStateRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, maxLength: 2000000 }
        revision: { type: integer, format: int64 }
    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: string, description: Required unless the current session has already verified the active temporary password. }
        newPassword: { type: string, minLength: 1, maxLength: 64 }
    CreateUserRequest: { type: object, required: [username, displayName, role], properties: { username: { type: string }, displayName: { type: string }, role: { type: string, enum: [ADMIN, MEMBER] } } }
    BookFormat: { type: string, enum: [EPUB, PDF] }
    BookFileStatus: { type: string, enum: [AVAILABLE, OPERATING, TRASHED, MISSING, DELETED] }
    LibraryRootStatus: { type: string, enum: [ONLINE, READ_ONLY, OFFLINE] }
    LibraryRoot:
      type: object
      required: [id, name, configuredPath, status, canRead, canWrite, canAtomicMove, canStage]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        configuredPath: { type: string }
        canonicalPath: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/LibraryRootStatus' }
        canRead: { type: boolean }
        canWrite: { type: boolean }
        canAtomicMove: { type: boolean }
        canStage: { type: boolean }
        freeBytes: { type: [integer, 'null'], format: int64 }
        lastCapabilityCheckAt: { type: [string, 'null'], format: date-time }
        lastScanAt: { type: [string, 'null'], format: date-time }
    LibraryRootList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/LibraryRoot' } } }
    Book:
      type: object
      required: [id, fileId, title, author, format, coverUrl, progress, addedAt, libraryRoot, relativePath, fingerprint, status, tags, subjectCodes]
      properties:
        id: { type: string, format: uuid }
        fileId: { type: string, format: uuid }
        title: { type: string }
        author: { type: string }
        series: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        format: { $ref: '#/components/schemas/BookFormat' }
        coverUrl: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        wordCount: { type: [string, 'null'] }
        addedAt: { type: string, format: date-time }
        libraryRoot: { type: string }
        relativePath: { type: string }
        fingerprint: { type: string }
        status: { $ref: '#/components/schemas/BookFileStatus' }
        tags: { type: array, items: { type: string } }
        subjectCodes: { type: array, items: { type: string, maxLength: 32 } }
    BookPage: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Book' } }, nextCursor: { type: [string, 'null'] } } }
    BrowseBook:
      type: object
      required: [id, title, author, coverUrl, available, addedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author: { type: string }
        description: { type: [string, 'null'] }
        format: { oneOf: [{ $ref: '#/components/schemas/BookFormat' }, { type: 'null' }] }
        coverUrl: { type: string }
        available: { type: boolean }
        addedAt: { type: string, format: date-time }
    BrowseBookPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BrowseBook' } }
        nextCursor: { type: [string, 'null'] }
    CategorySummary:
      type: object
      required: [id, name, bookCount, previewBooks, editable]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        bookCount: { type: integer, format: int64, minimum: 0 }
        previewBooks: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/BrowseBook' } }
        editable: { type: boolean }
    CategoryDetail:
      allOf:
        - { $ref: '#/components/schemas/CategorySummary' }
    CategoryList:
      type: object
      required: [items, editable]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CategorySummary' } }
        editable: { type: boolean }
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 2000 }
    CategoryOrderRequest:
      type: object
      required: [categoryIds]
      properties: { categoryIds: { type: array, items: { type: string, format: uuid } } }
    BookCategoriesRequest:
      type: object
      required: [categoryIds]
      properties: { categoryIds: { type: array, items: { type: string, format: uuid } } }
    ArticleCollectionVisibility: { type: string, enum: [PRIVATE, MEMBERS] }
    ArticleCollectionDraft:
      type: object
      required: [title, visibility]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 4000 }
        visibility: { $ref: '#/components/schemas/ArticleCollectionVisibility' }
    ArticleCollectionRevision:
      type: object
      required: [revision]
      properties: { revision: { type: integer, format: int64, minimum: 0 } }
    ArticleCollectionMembership:
      allOf:
        - { $ref: '#/components/schemas/ArticleCollectionRevision' }
        - type: object
          required: [articleIds]
          properties: { articleIds: { type: array, maxItems: 1000, uniqueItems: true, items: { type: string, format: uuid } } }
    CollectionArticleSummary:
      type: object
      required: [id, title, author, source_url, published_at, visibility, tags, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author: { type: string }
        source_url: { type: string }
        published_at: { type: string }
        visibility: { type: string, enum: [PUBLIC, PRIVATE] }
        tags: { type: string }
        cover_url: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ArticleCollectionSummary:
      type: object
      required: [id, title, description, visibility, ownerDisplayName, ownedByViewer, editable, articleCount, previewArticles, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/ArticleCollectionVisibility' }
        ownerDisplayName: { type: string }
        ownedByViewer: { type: boolean }
