            application/json:
              schema:
                type: object
                properties:
                  description: { type: [string, 'null'] }
                  authorBiography: { type: [string, 'null'] }
                  tableOfContents: { type: [string, 'null'] }
                  subjectCodes: { type: array, items: { type: string } }
  /books/revision:
    get:
