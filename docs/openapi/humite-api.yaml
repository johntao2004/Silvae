    get:
      tags: [Catalog]
      operationId: listBooks
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { $ref: '#/components/schemas/BookFormat' } }
        - { name: subjectCode, in: query, description: Thema subject prefix or UNCLASSIFIED, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: sort, in: query, schema: { type: string, enum: [RECENT, TITLE, AUTHOR], default: RECENT } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 60 } }
