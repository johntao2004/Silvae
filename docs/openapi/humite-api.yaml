openapi: 3.1.0
info:
  title: Humite API
  version: 1.0.0
  description: 家庭 NAS 电子图书馆的浏览、阅读、用户与受控文件事务 API。
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Users
  - name: Catalog
  - name: Categories
  - name: Booklists
  - name: Display catalog
  - name: Reading
  - name: Annotations
  - name: Reading posts
  - name: Articles
  - name: ArticleCollections
  - name: Knowledge
  - name: Vault
  - name: Site settings
  - name: File operations
  - name: Book uploads
  - name: AI
  - name: Reader fonts

paths:
  /vault/key/open:
    post:
      tags: [Vault]
      operationId: openVaultKey
      summary: 当前用户通过会话绑定的 2FA 后领取内容密钥，空旧库可原子升级
      responses:
        '200':
          description: 只用于当前页面内存，Cache-Control 为 no-store；禁止日志记录响应体
          content:
            application/json:
              schema:
                type: object
                required: [key, envelope, revision]
                properties:
                  key: { type: string, description: Base64 编码的 32 字节内容密钥，不持久缓存 }
                  envelope: { type: string }
                  revision: { type: integer, format: int64 }
        '401': { description: 未登录 }
        '403': { description: 无权限或当前会话未通过有效的 2FA }
        '409': { description: 服务器实例密钥不可用，或非空旧库缺少原内容密钥 }
  /vault/key/migrate:
    post:
      tags: [Vault]
      operationId: migrateVaultKey
      summary: 已通过 2FA 的旧浏览器迁移原内容密钥，验证已有密文，不改动文件及阅读记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, revision]
              properties:
                key: { type: string, maxLength: 64, description: 已持有且验证过的原内容密钥，不记录请求体 }
                revision: { type: integer, format: int64 }
      responses:
        '200': { description: 已迁移或相同密钥幂等重试，返回与 open 相同的 no-store 密钥响应 }
        '403': { description: 无权限或 2FA 授权已失效 }
        '409': { description: 原密钥校验失败或配置修订冲突，原数据保留 }
  /vault/config:
    get:
      tags: [Vault]
      operationId: getVaultConfig
      responses:
        '200': { description: 当前用户密钥信封与修订版本, content: { application/json: { schema: { $ref: '#/components/schemas/VaultConfig' } } } }
    put:
      tags: [Vault]
      operationId: updateVaultConfig
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VaultConfig' } } } }
      responses:
        '204': { description: 已保存密钥信封 }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /vault/objects:
    get:
      tags: [Vault]
      operationId: listVaultObjects
      responses:
        '200': { description: 当前用户密文对象列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VaultObject' } } } } }
  /vault/objects/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Vault]
      operationId: createVaultObject
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateVaultObjectRequest' } } } }
      responses:
        '204': { description: 已创建密文对象 }
        '400': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Vault]
      operationId: deleteVaultObject
      responses:
        '204': { description: 已删除密文对象 }
        '404': { $ref: '#/components/responses/Problem' }
  /vault/objects/{id}/chunks/{index}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 1023 } }
    put:
      tags: [Vault]
      operationId: uploadVaultChunk
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses:
        '204': { description: 分块已保存 }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Vault]
      operationId: downloadVaultChunk
      responses:
        '200': { description: 加密分块流, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /vault/objects/{id}/state:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Vault]
      operationId: updateVaultObjectState
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateVaultStateRequest' } } } }
      responses:
        '204': { description: 阅读状态已保存 }
        '404': { $ref: '#/components/responses/Problem' }
  /users/vault-policy:
    get:
      tags: [Users]
      summary: 查看加密书库开关及 2FA 服务配置状态
      responses:
        '200': { description: 管理员与站点所有者可查看, content: { application/json: { schema: { $ref: '#/components/schemas/VaultPolicy' } } } }
        '403': { description: 无安全设置查看权限 }
    put:
      tags: [Users]
      summary: 站点所有者配置加密书库开关，关闭或重新启用均使旧 2FA 授权失效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, revision]
              properties:
                enabled: { type: boolean }
                revision: { type: integer, format: int64, minimum: 0 }
      responses:
        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/VaultPolicy' } } } }
        '403': { description: 仅站点所有者可修改 }
        '409': { description: 修订冲突或服务器未配置加密密钥 }
  /auth/two-factor/status:
    get:
      tags: [Auth]
      summary: 当前用户身份验证器绑定与本会话的加密书库授权状态
      responses:
        '200': { description: 不返回种子或备用验证码, content: { application/json: { schema: { $ref: '#/components/schemas/TwoFactorStatus' } } } }
        '403': { description: 当前角色没有加密书库权限 }
  /auth/two-factor/enrollment:
    post:
      tags: [Auth]
      summary: 验证当前登录密码，获取 10 分钟有效的 TOTP 二维码资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, maxLength: 256 }
      responses:
        '200':
          description: 仅本次返回绑定种子，禁止缓存
          content:
            application/json:
              schema:
                type: object
                required: [id, secret, uri, expiresAt]
                properties:
                  id: { type: string, format: uuid }
                  secret: { type: string }
                  uri: { type: string }
                  expiresAt: { type: integer, format: int64 }
        '400': { description: 登录密码不正确 }
        '403': { description: 功能未启用或无权限 }
        '409': { description: 已绑定或未配置服务器密钥 }
        '429': { description: 验证尝试过于频繁 }
  /auth/two-factor/confirm:
    post:
      tags: [Auth]
      summary: 验证 6 位动态验证码并完成绑定，生成 10 条一次性备用验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, code]
              properties:
                id: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: 备用验证码仅返回一次，并授予本会话 5 分钟加密书库访问权限
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes: { type: array, items: { type: string } }
        '400': { description: 动态验证码无效 }
        '409': { description: 绑定过期或已完成 }
        '429': { description: 验证尝试过于频繁 }
  /auth/two-factor/verify:
    post:
      tags: [Auth]
      summary: 使用动态验证码或一次性备用验证码验证，授予当前会话 5 分钟加密书库访问权限
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorVerification' }
      responses:
        '200': { description: 当前授权状态, content: { application/json: { schema: { $ref: '#/components/schemas/TwoFactorStatus' } } } }
        '400': { description: 验证码无效、过期或已使用 }
        '403': { description: 功能关闭、无角色权限或尚未绑定 }
        '429': { description: 验证尝试过于频繁 }
  /auth/two-factor/lock:
    post:
      tags: [Auth]
      summary: 撤销当前会话的加密书库访问授权，不退出普通登录
      responses:
        '204': { description: 已锁定 }
  /auth/two-factor/renew:
    post:
      tags: [Auth]
      summary: 为仍已验证的可见阅读会话续期，不能恢复已锁定或已到期的授权
      responses:
        '200': { description: 新的授权到期时间, content: { application/json: { schema: { $ref: '#/components/schemas/TwoFactorStatus' } } } }
        '403': { description: 尚未验证、已锁定、已到期或功能被关闭 }
  /auth/two-factor/reset:
    post:
      tags: [Auth]
      summary: 同时验证登录密码与动态验证码或备用验证码后解除旧绑定，要求重新绑定并使所有旧授权失效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/TwoFactorVerification' }
                - type: object
                  required: [password]
                  properties:
                    password: { type: string, format: password, maxLength: 256 }
      responses:
        '204': { description: 旧绑定与剩余备用验证码已失效，书籍密文未改变 }
        '400': { description: 密码或验证码不正确 }
        '429': { description: 验证尝试过于频繁 }
  /articles/notes:
    get:
      tags: [Annotations]
      summary: 当前用户的文章笔记，独立于图书批注和加密书库
      responses:
        '200':
          description: 可访问文章中的个人笔记分组，不含书签或其他用户记录
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [articleId, title, author, annotations]
                  properties:
                    articleId: { type: string, format: uuid }
                    title: { type: string }
                    author: { type: string }
                    coverUrl: { type: [string, 'null'] }
                    annotations:
                      type: array
                      items: { $ref: '#/components/schemas/ArticleNoteEntry' }
        '401': { description: 需要登录 }
  /auth/profile:
    put:
      tags: [Auth]
      summary: 修改当前账户用户名和显示名称
      description: 需要当前密码；用户名变化时撤销旧身份会话并重建当前会话。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, displayName, currentPassword]
              properties:
                username: { type: string, pattern: '^[a-zA-Z0-9._-]{3,80}$' }
                displayName: { type: string, minLength: 1, maxLength: 120 }
                currentPassword: { type: string, format: password, maxLength: 200 }
      responses:
        '200': { description: 更新后的当前会话用户 }
        '400': { description: 输入格式不正确 }
        '403': { description: 当前密码不正确或没有登录 }
        '409': { description: 用户名已存在 }
        '429': { description: 操作过于频繁 }
  /auth/password-policy:
    get:
      tags: [Auth]
      security: []
      operationId: getPasswordPolicy
      responses:
        '200': { description: 当前密码规则, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordPolicy' } } } }
  /users/password-policy:
    put:
      tags: [Auth]
      operationId: savePasswordPolicy
      description: 仅站点所有者可修改，对新设置的密码生效，不拒绝已有密码登录。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordPolicy' } } } }
      responses:
        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordPolicy' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /mail/settings:
    get:
      tags: [Auth]
      operationId: getMailSettings
      description: 站点所有者读取 SMTP 配置；密码不返回
      responses:
        "200": { description: 操作成功 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
    put:
      tags: [Auth]
      operationId: saveMailSettings
      description: 站点所有者保存 SMTP 配置；空密码保留原值
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MailSettings" } } } }
      responses:
        "200": { description: 操作成功 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /mail/test:
    post:
      tags: [Auth]
      operationId: sendTestMail
      description: 站点所有者发送测试邮件
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryEmailInput" } } } }
      responses:
        "200": { description: 操作成功 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/recovery-email:
    get:
      tags: [Auth]
      operationId: getRecoveryEmail
      description: 读取当前用户已验证的找回邮箱
      responses:
        "200": { description: 操作成功 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Auth]
      operationId: bindRecoveryEmail
      description: 验证当前密码并发送邮箱确认链接
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryBindInput" } } } }
      responses:
        "200": { description: 操作成功 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/recovery/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      description: 申请重置链接；未知邮箱也返回相同响应
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryEmailInput" } } } }
      responses:
        "200": { description: 操作成功 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/recovery/verify:
    post:
      tags: [Auth]
      operationId: verifyRecoveryEmail
      description: 确认绑定邮箱；仅显式 POST 消耗链接
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryTokenInput" } } } }
      responses:
        "200": { description: 操作成功 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/recovery/reset:
    post:
      tags: [Auth]
      operationId: resetPasswordByEmail
      description: 重置密码并撤销全部旧会话
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryResetInput" } } } }
      responses:
        "200": { description: 操作成功 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/csrf:
    get:
      tags: [Auth]
      security: []
      operationId: getCsrf
      responses:
        '200': { description: CSRF token, content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
  /auth/setup:
    post:
      tags: [Auth]
      security: []
      operationId: setupOwner
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetupRequest' } } } }
      responses:
        '200': { description: Owner session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionUser' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/setup-status:
    get:
      tags: [Auth]
      security: []
      operationId: getSetupStatus
      responses:
        '200': { description: Whether owner initialization has already completed, content: { application/json: { schema: { $ref: '#/components/schemas/SetupStatus' } } } }
  /auth/registration-status:
    get:
      tags: [Auth]
      security: []
      operationId: getRegistrationStatus
      responses:
        '200': { description: Whether public registration is enabled, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationPolicy' } } } }
  /auth/register:
    post:
      tags: [Auth]
      security: []
      operationId: registerMember
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses:
        '200': { description: Registration succeeded, content: { application/json: { schema: { type: object, required: [registered], properties: { registered: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionUser' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/SessionUser' } } } }
  /auth/session-status:
    get:
      tags: [Auth]
      operationId: getSessionStatus
      responses:
        '200': { description: Current session lifetime and revocation status, content: { application/json: { schema: { $ref: '#/components/schemas/SessionStatus' } } } }
  /users/security-settings:
    get:
      tags: [Users]
      operationId: getSecuritySettings
      responses:
        '200': { description: Current self-registration toggle, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationPolicy' } } } }
    put:
      tags: [Users]
      operationId: updateSecuritySettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationPolicy' } } } }
      responses:
        '200': { description: Updated self-registration toggle, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationPolicy' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /users/session-policy:
    get:
      tags: [Users]
      operationId: getSessionPolicy
      responses:
        '200': { description: Current absolute session lifetime policy, content: { application/json: { schema: { $ref: '#/components/schemas/SessionPolicy' } } } }
    put:
      tags: [Users]
      operationId: updateSessionPolicy
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionPolicy' } } } }
      responses:
        '200': { description: Saved session policy, content: { application/json: { schema: { $ref: '#/components/schemas/SessionPolicy' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /users/active-sessions:
    get:
      tags: [Users]
      operationId: listActiveSessions
      responses:
        '200': { description: Active sessions across users, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ActiveSession' } } } } }
  /users/login-logs:
    get:
      tags: [Users]
      operationId: listLoginLogs
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated login audit log entries, content: { application/json: { schema: { $ref: '#/components/schemas/LoginLogPage' } } } }
  /site-settings:
    get:
      tags: [Site settings]
      security: []
      operationId: getSiteSettings
      responses:
        '200': { description: Site personalization and indexing settings, content: { application/json: { schema: { $ref: '#/components/schemas/SiteSettings' } } } }
    put:
      tags: [Site settings]
      operationId: updateSiteSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SiteSettings' } } } }
      responses:
        '200': { description: Saved site personalization settings, content: { application/json: { schema: { $ref: '#/components/schemas/SiteSettings' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /site-settings/robots.txt:
    get:
      tags: [Site settings]
      security: []
      operationId: getSiteSettingsRobotsTxt
      responses:
        '200': { description: Generated robots.txt policy, content: { text/plain: { schema: { type: string } } } }
  /robots.txt:
    get:
      tags: [Site settings]
      servers:
        - url: /
      security: []
      operationId: getRobotsTxt
      responses:
        '200': { description: Root robots.txt policy, content: { text/plain: { schema: { type: string } } } }
  /auth/permissions:
    get:
      tags: [Auth]
      operationId: getEffectivePermissions
      responses:
        '200': { description: Current database role and effective grants, content: { application/json: { schema: { $ref: '#/components/schemas/PermissionSnapshot' } } } }
  /role-permissions:
    get:
      tags: [Auth]
      operationId: getRolePermissionPolicy
      responses:
        '200': { description: Owner-only role policy, content: { application/json: { schema: { $ref: '#/components/schemas/RolePermissionPolicy' } } } }
        '403': { description: Owner required }
    put:
      tags: [Auth]
      operationId: updateRolePermissionPolicy
      description: Owner only. Complete ADMIN and MEMBER grants; OWNER authority is immutable. Validate role ceilings and page prerequisites. Uses optimistic revision and records an audit event.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RolePermissionPolicy' } } } }
      responses:
        '200': { description: Updated policy, content: { application/json: { schema: { $ref: '#/components/schemas/RolePermissionPolicy' } } } }
        '400': { description: Invalid or incomplete policy or dependency }
        '403': { description: Owner required or grant outside role ceiling }
        '409': { description: Policy revision conflict }
  /users/{id}/role:
    patch:
      tags: [Users]
      operationId: changeUserRole
      description: Owner only. Changes ADMIN or MEMBER with expectedRole concurrency validation. OWNER cannot be assigned or demoted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, expectedRole]
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
                expectedRole: { $ref: '#/components/schemas/UserRole' }
      responses:
        '200': { description: Updated account, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedUser' } } } }
        '403': { description: Owner required or immutable owner role }
        '409': { description: User role changed concurrently }
  /auth/password:
    put:
      tags: [Auth]
      operationId: changePassword
      description: A session authenticated with the current temporary password may set a new password without resubmitting its temporary password.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordRequest' } } } }
      responses:
        '200': { description: Updated session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionUser' } } } }
        '400': { description: Current password is required or invalid, or the new password fails policy validation }
        '409': { description: The credential or account state changed during the request }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '200': { description: Logged out }
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      responses:
        '200': { description: Managed users, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ManagedUser' } } } } } } }
    post:
      tags: [Users]
      operationId: createUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } } }
      responses:
        '200': { description: User and one-time password, content: { application/json: { schema: { type: object, required: [user, temporaryPassword], properties: { user: { $ref: '#/components/schemas/ManagedUser' }, temporaryPassword: { type: string } } } } } }
  /users/{id}/status:
    patch:
      tags: [Users]
      operationId: toggleUserStatus
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedUser' } } } }
  /users/{id}/temporary-password:
    post:
      tags: [Users]
      operationId: resetTemporaryPassword
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: One-time password, content: { application/json: { schema: { type: object, required: [username, temporaryPassword], properties: { username: { type: string }, temporaryPassword: { type: string } } } } } }
  /users/{id}/sessions/revoke:
    post:
      tags: [Users]
      operationId: revokeUserSessions
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Sessions revoked }
