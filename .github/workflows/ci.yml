name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: humite_test
          POSTGRES_USER: humite
          POSTGRES_PASSWORD: humite-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U humite -d humite_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Checkstyle and run backend tests
        env:
          HUMITE_NATIVE_TEST_URL: jdbc:postgresql://localhost:5432/humite_test
          HUMITE_NATIVE_TEST_USER: humite
          HUMITE_NATIVE_TEST_PASSWORD: humite-ci-password
        run: ./apps/server/mvnw -f apps/server/pom.xml checkstyle:check test
