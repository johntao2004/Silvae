services:
  app:
    environment:
      HUMITE_STORAGE_ROOTS_1_NAME: 旧书归档
      HUMITE_STORAGE_ROOTS_1_PATH: /library/archive
    volumes:
      - type: bind
        source: ${HUMITE_LIBRARY_ARCHIVE:?set HUMITE_LIBRARY_ARCHIVE in .env}
        target: /library/archive
  worker:
    environment:
      HUMITE_STORAGE_ROOTS_1_NAME: 旧书归档
      HUMITE_STORAGE_ROOTS_1_PATH: /library/archive
    volumes:
      - type: bind
        source: ${HUMITE_LIBRARY_ARCHIVE:?set HUMITE_LIBRARY_ARCHIVE in .env}
        target: /library/archive
