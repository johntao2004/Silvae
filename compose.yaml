name: humite

x-humite-common: &humite-common
  image: ${HUMITE_IMAGE:-ghcr.io/johntao2004/humite:latest}
  pull_policy: ${HUMITE_PULL_POLICY:-missing}
  build:
    context: .
    dockerfile: docker/humite.Dockerfile
  restart: unless-stopped
  user: "${HUMITE_UID:-1000}:${HUMITE_GID:-1000}"
  environment: &humite-environment
    HUMITE_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-humite}
    HUMITE_DATABASE_USER: ${POSTGRES_USER:-humite}
    HUMITE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-humite-docker-prod}
    HUMITE_COOKIE_SECURE: ${HUMITE_SESSION_COOKIE_SECURE:-false}
    HUMITE_PUBLIC_BASE_URL: ${HUMITE_PUBLIC_BASE_URL:-http://localhost:8080}
    HUMITE_UPLOAD_MAX_FILE_SIZE: ${HUMITE_UPLOAD_MAX_FILE_SIZE:-2147483648}
    HUMITE_UPLOAD_MAX_BATCH_FILES: ${HUMITE_UPLOAD_MAX_BATCH_FILES:-20}
    HUMITE_UPLOAD_RETENTION: ${HUMITE_UPLOAD_RETENTION:-24h}
    HUMITE_UPLOAD_MAX_COVER_SIZE: ${HUMITE_UPLOAD_MAX_COVER_SIZE:-20971520}
    HUMITE_METADATA_OPEN_LIBRARY_ENABLED: ${HUMITE_METADATA_OPEN_LIBRARY_ENABLED:-true}
    HUMITE_METADATA_GOOGLE_API_KEY: ${HUMITE_METADATA_GOOGLE_API_KEY:-}
    HUMITE_AI_SETTINGS_ENCRYPTION_KEY: ${HUMITE_AI_SETTINGS_ENCRYPTION_KEY:-}
    HUMITE_TWO_FACTOR_ENCRYPTION_KEY: ${HUMITE_TWO_FACTOR_ENCRYPTION_KEY:-}
    HUMITE_STORAGE_ROOTS_0_NAME: ${HUMITE_LIBRARY_NAME:-主书库}
    HUMITE_STORAGE_ROOTS_0_PATH: /library/main
    HUMITE_FONT_STORAGE_PATH: /var/lib/humite/fonts
    HUMITE_CONTENT_STORAGE_PATH: /var/lib/humite/content
    HUMITE_KEY_STORAGE_PATH: /var/lib/humite/keys
    TZ: ${TZ:-Asia/Shanghai}
  volumes:
    - ${HUMITE_LIBRARY_MAIN:-./data/library}:/library/main
    - humite-data:/var/lib/humite
  tmpfs:
    - /tmp/humite:size=512m,mode=1777
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *humite-common
    environment:
      <<: *humite-environment
      SPRING_PROFILES_ACTIVE: api
      HUMITE_API_PORT: 8080
    ports:
      - "${HUMITE_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  worker:
    <<: *humite-common
    environment:
      <<: *humite-environment
      SPRING_PROFILES_ACTIVE: worker
    healthcheck:
      disable: true

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-humite}
      POSTGRES_USER: ${POSTGRES_USER:-humite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-humite-docker-prod}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - humite-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-humite} -d ${POSTGRES_DB:-humite}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  humite-data:
  humite-postgres:
